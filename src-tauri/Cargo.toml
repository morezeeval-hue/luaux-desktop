[package]
name = "luaux-desktop"
version = "1.0.0"
description = "LuauX — offline Luau learning course and code runner"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Speech. piper-rs builds espeak-ng from source, so cmake is a build
# requirement; the intonation step is skipped because it does not build on
# every host and the prebuilt table ships in the bundled data.
piper-rs = { version = "0.2", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
sha2 = "0.10"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
